[project]
name = "servicio-clientes"
version = "1.4.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "sqlalchemy[asyncio]==2.0.35",
  "asyncpg==0.29.0",
  "httpx==0.27.2",
  "pyjwt==2.9.0",
  "pydantic-settings==2.5.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "pytest-asyncio==0.24.0", "respx==0.21.1", "ruff==0.6.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
